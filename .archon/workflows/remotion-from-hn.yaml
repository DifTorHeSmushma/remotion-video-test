name: remotion-from-hn
description: |
  Generate a short Remotion video from today's top Hacker News front-page
  article. Bootstraps its own Remotion project into the workflow's artifacts
  directory — the host repo does not need to be a Remotion project.

  The video is ABOUT THE ARTICLE'S IDEAS, not about HN itself. Scoring,
  comments, and platform metadata are context for finding the article, not
  subject matter for the video.

  Requires the `remotion-best-practices` skill (`npx skills add remotion-dev/skills --yes`).
  The `visual-diagrams` skill is used if the plan chooses a diagram-heavy
  scene. If that skill is missing, the workflow still runs — the planner just
  declines diagrams.

  Audio is layered and every layer is OPT-IN via env:

    Voice (TTS):   VOICE_PROVIDER = cartesia | elevenlabs | none  (auto)
    Music (BGM):   MUSIC_PROVIDER = elevenlabs | none             (opt-in)
    SFX:           SFX_PROVIDER   = elevenlabs | none             (opt-in)

  Brand overlay is optional — drop a `.archon/brand.yaml` (see
  `.archon/brand.example.yaml`) to control palette / font / logo / voice tone
  / music mood. Missing file ⇒ neutral defaults.

  Archive: when `RENDER_ENABLED=true` (default), the final mp4 is rendered
  and copied to `./videos/<YYYY-MM-DD>-<slug>/<slug>.mp4` so multiple runs
  accumulate side-by-side rather than overriding each other. `./videos/` is
  added to `.gitignore` — flip that to track renders.

  `$ARGUMENTS` is ignored — the workflow always picks the top front-page
  story.

provider: claude
model: sonnet

nodes:
  # ── Layer 0: Preflight ─────────────────────────────────────────────

  - id: check-skill
    bash: |
      set -eu
      if   [ -e ".claude/skills/remotion-best-practices/SKILL.md" ] \
        || [ -e ".agents/skills/remotion-best-practices/SKILL.md" ] \
        || [ -e "$HOME/.claude/skills/remotion-best-practices/SKILL.md" ]; then
        echo "remotion-best-practices: installed"
      else
        cat >&2 <<'MSG'
      FATAL: the remotion-best-practices skill is not installed.

      Install once with:

          npx skills add remotion-dev/skills --yes

      Then re-run this workflow.
      MSG
        exit 1
      fi

      # Log visual-diagrams presence but do NOT fail — it's optional.
      if   [ -e ".claude/skills/visual-diagrams/SKILL.md" ] \
        || [ -e "$HOME/.claude/skills/visual-diagrams/SKILL.md" ]; then
        echo "visual-diagrams: installed"
      else
        echo "visual-diagrams: not installed (diagrams will be disabled)"
      fi
    timeout: 15000

  # ── Layer 1: Fetch source + scaffold (parallel) ────────────────────

  - id: fetch-article
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR"
      OUT="$ARTIFACTS_DIR/article.json"

      if ! command -v jq >/dev/null 2>&1; then
        echo "FATAL: jq is required. Install with: brew install jq" >&2
        exit 1
      fi

      RAW=$(curl -fsSL "https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=1")

      echo "$RAW" | jq '.hits[0] | {
        object_id: .objectID,
        title: .title,
        url: .url,
        author: .author,
        points: .points,
        num_comments: .num_comments,
        story_text: .story_text,
        created_at: .created_at
      }' > "$OUT"

      TITLE=$(jq -r '.title' "$OUT")
      URL=$(jq -r '.url // "(no url — Ask HN style)"' "$OUT")
      echo "Picked: $TITLE"
      echo "URL:    $URL"
      echo "Wrote:  $OUT"
    depends_on: [check-skill]
    timeout: 30000

  - id: derive-slug
    bash: |
      set -euo pipefail
      TITLE=$(jq -r '.title' "$ARTIFACTS_DIR/article.json")

      # PascalCase slug for the composition ID (Remotion requires letters, digits, no dashes).
      # Strategy: lowercase alnum words, uppercase first letter of each, concatenate, trim to 48.
      COMP_ID=$(printf '%s' "$TITLE" \
        | LC_ALL=C tr '[:upper:]' '[:lower:]' \
        | LC_ALL=C sed -E 's/[^a-z0-9]+/ /g' \
        | awk '{for(i=1;i<=NF;i++){ $i = toupper(substr($i,1,1)) substr($i,2) }; print}' \
        | LC_ALL=C tr -d ' ' \
        | cut -c1-48)

      # Guarantee non-empty and that it starts with a letter (Remotion/TS identifier rules).
      if [ -z "$COMP_ID" ] || ! printf '%s' "$COMP_ID" | grep -qE '^[A-Za-z]'; then
        COMP_ID="HnStory$(date +%s)"
      fi

      # kebab-case slug for filesystem paths.
      FS_SLUG=$(printf '%s' "$TITLE" \
        | LC_ALL=C tr '[:upper:]' '[:lower:]' \
        | LC_ALL=C sed -E 's/[^a-z0-9]+/-/g' \
        | LC_ALL=C sed -E 's/^-+|-+$//g' \
        | cut -c1-64)
      [ -z "$FS_SLUG" ] && FS_SLUG="hn-story-$(date +%s)"

      DATE=$(date +%Y-%m-%d)

      mkdir -p "$ARTIFACTS_DIR"
      cat > "$ARTIFACTS_DIR/slug.json" <<EOF
      {
        "composition_id": "$COMP_ID",
        "fs_slug": "$FS_SLUG",
        "date": "$DATE",
        "archive_dirname": "$DATE-$FS_SLUG"
      }
      EOF

      echo "composition_id=$COMP_ID"
      echo "fs_slug=$FS_SLUG"
      echo "archive_dirname=$DATE-$FS_SLUG"
    depends_on: [fetch-article]
    timeout: 10000

  - id: scaffold-project
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR"
      PROJ="$ARTIFACTS_DIR/project"

      if [ -f "$PROJ/package.json" ]; then
        echo "Remotion project already scaffolded at $PROJ (resumed run?)"
      else
        cd "$ARTIFACTS_DIR"
        npx --yes create-video@latest --yes --blank --no-tailwind project
      fi

      cd "$PROJ"
      if command -v pnpm >/dev/null 2>&1; then
        pnpm install --prefer-offline
      elif command -v bun >/dev/null 2>&1; then
        bun install
      else
        npm install --no-audit --no-fund
      fi

      echo "PROJECT_DIR=$PROJ"
    depends_on: [check-skill]
    timeout: 300000

  # ── Layer 2: Plan (content-focused, hook-first, diagram-aware) ─────

  - id: plan-video
    prompt: |
      You are planning a short Remotion video about a Hacker News article.

      ── Source material ─────────────────────────────────────────────────

      Article metadata (HN):
      $fetch-article.output

      Article body: **first, use WebFetch** to pull the article's readable
      content from the URL in article.json (if a URL is present). Write the
      extracted substance to `$ARTIFACTS_DIR/article-body.md` (plain text or
      markdown, stripped of navigation/ads/footer). If the URL can't be
      fetched (paywall, 404, SPA) or the article is an Ask HN post, fall back
      to `story_text` from the HN JSON. If neither is available, use the
      title alone and NOTE that explicitly at the top of article-body.md.

      Slug + composition ID already derived upstream (use these verbatim —
      do not invent new ones):
      $derive-slug.output

      ── Content focus (non-negotiable) ──────────────────────────────────

      This video is ABOUT THE ARTICLE'S IDEAS. It is NOT about Hacker News.
      Do NOT reference: "this hit the front page", "X points", "Y comments",
      "discussed on HN", the submitter's username, or HN as a platform. The
      viewer doesn't know — and doesn't care — where you found the article.
      Treat HN metadata as source-tracking only.

      ── Constraints ─────────────────────────────────────────────────────

      - **3–5 scenes**, total target 30–60 seconds silent / dictated by
        voice length if voice is enabled (builder uses calculateMetadata).
      - 30fps, 1920×1080.
      - Scene IDs are stable: `scene1`, `scene2`, ...
      - On-screen text supports narration — it is NOT a transcript. Headlines,
        keywords, numerical callouts.
      - No voiceover-hardcoded claims you can't back from the article body.
      - Composition ID and fs slug come from `$derive-slug.output` verbatim.

      ── Scene 1 is a HOOK ───────────────────────────────────────────────

      Open with retention in mind:
      - First 1.5–3 seconds must earn the next 25. Curiosity gap, surprise,
        pattern-interrupt, counter-intuitive claim, or a concrete high-stakes
        fact from the article.
      - DO NOT use "Welcome to...", "Today we'll talk about...",
        "In this video...", a generic title card, or the article's dry title
        as the whole opening.
      - On-screen text scene 1: a single punchy teaser (≤ 10 words), not the
        article title, not a subtitle of the narration.
      - Narration scene 1: start with the hook line. No preamble.
      - Visual: dynamic motion — entrance/build-on animation, not a static
        headline fading in.

      ── Diagram decision ────────────────────────────────────────────────

      Decide whether any scene benefits from a diagram component from the
      `visual-diagrams` skill (flow, hub-and-spoke, layered, comparison,
      infographic). Heuristics:
        - YES when the article describes a system, pipeline, architecture,
          before/after comparison, N-stage process, or connected components.
        - NO when it's a manifesto, opinion, narrative, list of ideas, bug
          report, or something that reads as a single argument.
      Err toward NO — only use diagrams when the article is genuinely about
      structure.

      If diagrams are used, specify which scenes and which diagram type per
      scene. Those scenes will use `InfographicFlow` / `HubAndSpoke` /
      `FlowDiagram` / `LayeredArchitecture` / `ComparisonDiagram` from the
      skill rather than plain typography.

      ── Artifacts to write (all three required) ─────────────────────────

      1. `$ARTIFACTS_DIR/article-body.md` — extracted article content (see
         "Source material" above).

      2. `$ARTIFACTS_DIR/video-plan.md` — structured plan:

             # Video Plan

             **Article:** <title>
             **URL:** <url>
             **Composition ID:** <composition_id from slug.json>  (1920x1080 @ 30fps)
             **Silent target duration:** <N>s
             **Uses diagrams:** yes | no
             **Diagram scenes:** (only when yes — list scene IDs)

             ## scene1 — HOOK — <short name> (nominal <start>s → <end>s)
             - **Beat:** <what the viewer learns>
             - **On-screen text:** "<≤10-word teaser>"
             - **Visuals:** <dynamic entrance motion>
             - **Diagram:** none | flow | hub-and-spoke | layered | comparison | infographic
             - **Transition out:** cut | fade | slide | wipe

             ## scene2 — <short name> (nominal <start>s → <end>s)
             - **Beat:** ...
             - **On-screen text:** ...
             - **Visuals:** ...
             - **Diagram:** ...
             - **Transition out:** ...

             ## ... (up to scene5)

      3. `$ARTIFACTS_DIR/narration.json` — spoken script for TTS:

             {
               "composition_id": "<same as slug.json>",
               "fps": 30,
               "scenes": [
                 { "id": "scene1", "text": "<hook line, 12–25 words>" },
                 { "id": "scene2", "text": "..." },
                 ...
               ]
             }

         Plain prose only — no markdown, no pronunciation tags, no "Scene 1:"
         preambles. Each `text` is exactly what will be spoken.

      4. `$ARTIFACTS_DIR/diagram-flag.json` — machine-readable diagram plan:

             {
               "uses_diagrams": true | false,
               "reason": "<one sentence>",
               "scenes": [
                 { "id": "scene2", "type": "flow", "description": "..." }
               ]
             }

         `scenes` is empty when `uses_diagrams: false`.

      After writing all four files, print a one-line-per-scene summary to
      stdout. Downstream nodes read the files from disk.
    depends_on: [fetch-article, scaffold-project, derive-slug]
    idle_timeout: 600000

  # ── Layer 3: Audio layers (parallel, all opt-in) ───────────────────

  - id: generate-audio
    bash: |
      set -euo pipefail
      uv run .archon/scripts/generate_voiceover.py "$ARTIFACTS_DIR"
    depends_on: [plan-video]
    timeout: 600000

  - id: generate-music
    bash: |
      set -euo pipefail
      uv run .archon/scripts/generate_music.py "$ARTIFACTS_DIR"
    depends_on: [plan-video, generate-audio]
    timeout: 600000

  - id: generate-sfx
    bash: |
      set -euo pipefail
      uv run .archon/scripts/generate_sfx.py "$ARTIFACTS_DIR"
    depends_on: [plan-video]
    timeout: 600000

  # ── Layer 4: Build composition ─────────────────────────────────────

  - id: build-composition
    command: remotion-build-composition
    depends_on: [generate-audio, generate-music, generate-sfx]
    trigger_rule: all_success
    context: fresh
    skills:
      - remotion-best-practices
      - visual-diagrams
    idle_timeout: 1200000

  # ── Layer 5: QA review (read-only intent) ──────────────────────────

  - id: qa-review
    prompt: |
      You are a Remotion code reviewer. **Review only — do NOT edit source
      files under `$ARTIFACTS_DIR/project/src`.** You may Write review
      artifacts to `$ARTIFACTS_DIR/qa-findings.md` and run Bash for compile
      checks. Treat the source tree as read-only.

      Project:     `$ARTIFACTS_DIR/project`
      Plan:        `$ARTIFACTS_DIR/video-plan.md`
      Slug:        `$ARTIFACTS_DIR/slug.json` — composition_id + fs_slug
      Diagram:     `$ARTIFACTS_DIR/diagram-flag.json`
      Voice:       `$ARTIFACTS_DIR/audio/voice-manifest.json`    (may be absent)
      Music:       `$ARTIFACTS_DIR/audio/music-manifest.json`    (may be absent)
      SFX:         `$ARTIFACTS_DIR/audio/sfx-manifest.json`      (may be absent)
      Brand:       `.archon/brand.yaml`                          (may be absent)

      First, detect the mode flags:

          [ -f "$ARTIFACTS_DIR/audio/voice-manifest.json" ] && VOICED=true  || VOICED=false
          [ -f "$ARTIFACTS_DIR/audio/music-manifest.json" ] && MUSIC=true   || MUSIC=false
          [ -f "$ARTIFACTS_DIR/audio/sfx-manifest.json"   ] && SFX=true     || SFX=false
          USES_DIAGRAMS=$(jq -r '.uses_diagrams' "$ARTIFACTS_DIR/diagram-flag.json" 2>/dev/null || echo false)

      Base checks (always):
      1. **Compiles.** `cd $ARTIFACTS_DIR/project && npx --yes tsc --noEmit`.
      2. **Registered.** Composition ID from slug.json is exported from
         `src/Root.tsx`. Do NOT flag leftover scaffold compositions (`MyComp`).
      3. **Plan alignment.** Scene IDs + nominal durations match the plan.
      4. **Hook quality.** Scene 1's narration and on-screen text do NOT
         mention Hacker News, points, comments, or read like a title card.
         On-screen text is a short teaser, not the article title.
         Narration opens with a hook line (no "Welcome", "Today", etc).
      5. **Content focus.** No references to HN metadata (points, comments,
         platform, upvotes, front page, submitter) anywhere in the video.
      6. **Remotion best practices** (use `remotion-best-practices` skill).

      Voiced-mode checks (when VOICED=true):
      7. Every scene in voice-manifest has a matching `<Audio>` with the
         correct `staticFile()` path.
      8. Duration source of truth is `calculateMetadata` using
         `getAudioDuration(staticFile(...))` per scene. Hardcoded frame
         constants are HIGH-severity.
      9. No verbatim double-narration on screen.

      Music-mode checks (when MUSIC=true):
     10. A single `<Audio>` reads `music-manifest.path` via `staticFile()`.
     11. Music audio has `volume` set (defaults in manifest around 0.2).
         Unducked music under narration is HIGH-severity.
     12. Music audio is placed at composition level so it spans all scenes.

      SFX-mode checks (when SFX=true):
     13. Intro whoosh, outro stinger, and N-1 transition ticks from the SFX
         manifest are each wired with a Sequence offset that matches the
         anchor (`composition_start`, `composition_end`, `scene_boundary`).
     14. No SFX is placed mid-scene unless the plan explicitly required it.

      Diagram-mode checks (when USES_DIAGRAMS=true):
     15. Each scene listed in diagram-flag.scenes uses the appropriate
         component from `visual-diagrams` (InfographicFlow, HubAndSpoke,
         FlowDiagram, LayeredArchitecture, ComparisonDiagram).
     16. Node/connection styling follows visual-diagrams rules (gradient
         fills, 2-layer shadows, ≥2.5px connection strokes, no Unicode emoji
         as icons).

      Write findings to `$ARTIFACTS_DIR/qa-findings.md`, one section per
      issue, each prefixed with `CRITICAL`, `HIGH`, `MED`, or `LOW`.

      Verdict:
      - `pass`            — zero CRITICAL and zero HIGH issues
      - `needs-iteration` — at least one CRITICAL or HIGH issue

      Your final message must be the JSON verdict.
    depends_on: [build-composition]
    context: fresh
    skills:
      - remotion-best-practices
      - visual-diagrams
    output_format:
      type: object
      properties:
        verdict:
          type: string
          enum: [pass, needs-iteration]
        modes:
          type: object
          properties:
            voiced:
              type: string
              enum: ["true", "false"]
            music:
              type: string
              enum: ["true", "false"]
            sfx:
              type: string
              enum: ["true", "false"]
            diagrams:
              type: string
              enum: ["true", "false"]
        critical_count:
          type: number
        high_count:
          type: number
        med_count:
          type: number
        low_count:
          type: number
        summary:
          type: string
      required: [verdict, summary]

  # ── Layer 6: Iterate (conditional) ─────────────────────────────────

  - id: iterate
    command: remotion-iterate
    depends_on: [qa-review]
    when: "$qa-review.output.verdict == 'needs-iteration'"
    context: fresh
    skills:
      - remotion-best-practices
      - visual-diagrams
    idle_timeout: 900000

  # ── Layer 7: Verify ────────────────────────────────────────────────

  - id: verify
    bash: |
      set -euo pipefail
      COMP_ID=$(jq -r '.composition_id' "$ARTIFACTS_DIR/slug.json")
      cd "$ARTIFACTS_DIR/project"

      echo "=== tsc --noEmit ==="
      npx --yes tsc --noEmit

      echo ""
      echo "=== remotion compositions ==="
      npx --yes remotion compositions

      echo ""
      echo "Composition ID for downstream render: $COMP_ID"
    depends_on: [qa-review, iterate]
    trigger_rule: none_failed_min_one_success
    timeout: 180000

  # ── Layer 8: Render + archive (opt-out) ────────────────────────────

  - id: archive-render
    bash: |
      set -euo pipefail

      # Opt-out: set RENDER_ENABLED=false to skip this node.
      RENDER="${RENDER_ENABLED:-true}"
      if [ "$RENDER" = "false" ] || [ "$RENDER" = "0" ]; then
        echo "RENDER_ENABLED=$RENDER — skipping render + archive."
        exit 0
      fi

      SLUG=$(jq -r '.fs_slug' "$ARTIFACTS_DIR/slug.json")
      COMP_ID=$(jq -r '.composition_id' "$ARTIFACTS_DIR/slug.json")
      ARCHIVE_DIRNAME=$(jq -r '.archive_dirname' "$ARTIFACTS_DIR/slug.json")

      REPO_ROOT="$(pwd)"
      DEST="$REPO_ROOT/videos/$ARCHIVE_DIRNAME"
      mkdir -p "$DEST"

      cd "$ARTIFACTS_DIR/project"
      echo "=== remotion render $COMP_ID ==="
      npx --yes remotion render "$COMP_ID" "out/$SLUG.mp4"

      cp "out/$SLUG.mp4" "$DEST/$SLUG.mp4"

      # Copy useful artifacts alongside the mp4 for posterity.
      for f in "$ARTIFACTS_DIR/video-plan.md" \
               "$ARTIFACTS_DIR/narration.json" \
               "$ARTIFACTS_DIR/qa-findings.md" \
               "$ARTIFACTS_DIR/article.json" \
               "$ARTIFACTS_DIR/article-body.md" \
               "$ARTIFACTS_DIR/audio/voice-manifest.json" \
               "$ARTIFACTS_DIR/audio/music-manifest.json" \
               "$ARTIFACTS_DIR/audio/sfx-manifest.json"; do
        [ -f "$f" ] && cp "$f" "$DEST/" || true
      done

      # Append to the running index.
      cd "$REPO_ROOT"
      INDEX="videos/index.md"
      if [ ! -f "$INDEX" ]; then
        printf '# Video archive\n\n| Date | Title | URL | Verdict | Folder |\n|---|---|---|---|---|\n' > "$INDEX"
      fi
      TITLE=$(jq -r '.title' "$ARTIFACTS_DIR/article.json")
      URL=$(jq -r '.url // "(Ask HN)"' "$ARTIFACTS_DIR/article.json")
      DATE=$(jq -r '.date' "$ARTIFACTS_DIR/slug.json")
      VERDICT="$qa-review.output.verdict"
      # Escape pipes in title to avoid breaking markdown table.
      TITLE_SAFE=$(printf '%s' "$TITLE" | sed 's/|/\\|/g')
      printf '| %s | %s | %s | %s | [%s](%s) |\n' \
        "$DATE" "$TITLE_SAFE" "$URL" "$VERDICT" \
        "$ARCHIVE_DIRNAME" "$ARCHIVE_DIRNAME" >> "$INDEX"

      echo "Archived: $DEST"
    depends_on: [verify]
    timeout: 600000

  # ── Layer 9: Receipt ───────────────────────────────────────────────

  - id: summarize
    prompt: |
      Emit a short receipt under 200 words, plain text, no code fences, no
      leading or trailing prose. Match this structure exactly:

          Remotion HN video
          Article:   <title from $fetch-article.output>
          URL:       <url from $fetch-article.output>
          Comp ID:   <composition_id from $derive-slug.output>
          Modes:     voiced=<$qa-review.output.modes.voiced> music=<..modes.music> sfx=<..modes.sfx> diagrams=<..modes.diagrams>
          Verdict:   <$qa-review.output.verdict>

          Archive:   ./videos/<archive_dirname from $derive-slug.output>/
          Project:   $ARTIFACTS_DIR/project
          Plan:      $ARTIFACTS_DIR/video-plan.md
          Body:      $ARTIFACTS_DIR/article-body.md
          Findings:  $ARTIFACTS_DIR/qa-findings.md

          Preview:   cd $ARTIFACTS_DIR/project && npx remotion studio
          Render (if disabled above):
                     cd $ARTIFACTS_DIR/project && npx remotion render <comp-id>

          QA summary:
          <one-paragraph: $qa-review.output.summary>

      Context substituted:
      - Article JSON: $fetch-article.output
      - Slug JSON:    $derive-slug.output
      - QA modes:     $qa-review.output.modes
      - QA verdict:   $qa-review.output.verdict
      - QA summary:   $qa-review.output.summary
      - Archive stdout:
      $archive-render.output
    depends_on: [archive-render]
    model: haiku
    allowed_tools: []
