name: diy-full-auto-v2
description: |
  Archon port of the DIY-YT Creator full-auto-v2 orchestrator. Runs the entire
  video-creation pipeline (Phases 0 → 5 pre-render) as an isolated DAG.
  Each phase runs in a FRESH session (context: fresh) so heavy intermediate
  artifacts (web searches, briefs, scripts, sync JSON, render logs) stay out
  of the upstream context.

  Input: free-form topic, structured brief, or "Topic --upload", e.g.:
    "docker sandboxes"
    "Claude Code v2.1.20 --upload"
    "<multi-line brief with **Topic**:, **Duration**:, ...>"

  HARD GATES (workflow halts):
    - Phase 2.5 Critique (hook/story/loop/banned-phrase gates)
    - Phase 2b  Fact-check (Tier-1 claim verification)
    - Phase 5   Render gate (workflow stops at render-prep; actual render
                requires explicit user approval + manual `pnpm exec remotion render`)

  PARALLEL BRANCH:
    Phase 3.5 (retention) and Phase 3.5b (screenshots, optional) run in
    parallel after Phase 3. Both must complete before Phase 4.

  SKIPPED BY DEFAULT:
    Phase 4b (Visual QA) — opt-in only; run /diy-remotion-qa afterwards.
    Phase 6/7 (description/upload) — run separately after render.

provider: claude
model: sonnet

nodes:

  # ═════════════════════════════════════════════════════════════════════════
  # Layer 0 — Parameter extraction & status init
  # ═════════════════════════════════════════════════════════════════════════

  - id: parse-params
    prompt: |
      Extract workflow parameters from the user's input. Input:

      $ARGUMENTS

      Rules:
      - Detect duration patterns ("15s", "30s", "45s", "60s", "90s", "2min",
        "3min", "5min", "7min", "8min"). Default: "5min".
      - Detect `--upload` flag → upload_requested = true.
      - Structured briefs contain fields like "**Topic**:", "**Duration**:",
        "**Tone**:", "**Resolution**:", "**Target audience**:",
        "**Key angle**:", "**Links**:", "**Must mention**:",
        "**Technical terms**:". Extract verbatim if present.
      - Freeform input: topic = the input with flags/duration stripped.
      - Derive animation_name from the topic as PascalCase, stripping
        spaces/punctuation. Examples:
          "docker sandboxes"    → "DockerSandboxes"
          "Claude Code v2.1.20" → "ClaudeCodeV2120"
          "remote agentic coding" → "RemoteAgenticCoding"
      - All string fields may be empty strings. upload_requested is boolean.
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        topic:             { type: string }
        duration:          { type: string }
        tone:              { type: string }
        resolution:        { type: string }
        target_audience:   { type: string }
        key_angle:         { type: string }
        links:             { type: string }
        must_mention:      { type: string }
        technical_terms:   { type: string }
        animation_name:    { type: string }
        upload_requested:  { type: boolean }
      required: [topic, animation_name, duration]

  - id: init-context
    bash: |
      set -eu
      # $nodeId.output.field values are auto shell-quoted by Archon, so use
      # them bare (NOT inside double quotes) — otherwise the quoting breaks.
      animation_name=$parse-params.output.animation_name
      topic=$parse-params.output.topic
      duration=$parse-params.output.duration
      tone=$parse-params.output.tone
      resolution=$parse-params.output.resolution
      target_audience=$parse-params.output.target_audience
      key_angle=$parse-params.output.key_angle
      links=$parse-params.output.links
      must_mention=$parse-params.output.must_mention
      technical_terms=$parse-params.output.technical_terms
      upload_requested=$parse-params.output.upload_requested

      # Apply defaults for missing optional fields
      : "${tone:=tech-influencer-edgy}"
      : "${resolution:=1920x1080}"

      mkdir -p "src/${animation_name}" ".agents/plans" "public/audio/${animation_name}" "out/${animation_name}"
      mkdir -p "$ARTIFACTS_DIR"

      # Durable params for downstream phases. Use python to JSON-escape
      # values safely (topics may contain quotes/backslashes).
      export TOPIC="$topic" DURATION="$duration" TONE="$tone" \
             RESOLUTION="$resolution" TARGET_AUDIENCE="$target_audience" \
             KEY_ANGLE="$key_angle" LINKS="$links" \
             MUST_MENTION="$must_mention" TECHNICAL_TERMS="$technical_terms" \
             ANIMATION_NAME="$animation_name" \
             UPLOAD_REQUESTED="$upload_requested"
      python - <<'PY' > "$ARTIFACTS_DIR/params.json"
      import json, os
      print(json.dumps({
        "topic": os.environ.get("TOPIC", ""),
        "duration": os.environ.get("DURATION", ""),
        "tone": os.environ.get("TONE", ""),
        "resolution": os.environ.get("RESOLUTION", ""),
        "target_audience": os.environ.get("TARGET_AUDIENCE", ""),
        "key_angle": os.environ.get("KEY_ANGLE", ""),
        "links": os.environ.get("LINKS", ""),
        "must_mention": os.environ.get("MUST_MENTION", ""),
        "technical_terms": os.environ.get("TECHNICAL_TERMS", ""),
        "animation_name": os.environ.get("ANIMATION_NAME", ""),
        "upload_requested": os.environ.get("UPLOAD_REQUESTED", "false").lower() == "true",
      }, indent=2))
      PY

      printf '%s\n' "$animation_name" > "$ARTIFACTS_DIR/animation_name.txt"
      printf '%s\n' "$animation_name" > ".claude/diy-active.txt"

      # Initialize phase-status.md
      cat > "src/${animation_name}/phase-status.md" <<STATUS
      # Phase Status: ${animation_name}

      | Phase | Status | Completed |
      |-------|--------|-----------|
      | 0 - Research | pending | |
      | 1 - Plan | pending | |
      | 2 - Script | pending | |
      | 2.5 - Critique | pending | |
      | 2a - TTS Script | pending | |
      | 2b - Fact Check | pending | |
      | 3 - Audio | pending | |
      | 3.2 - BG Music | pending | |
      | 3.5 - Retention | pending | |
      | 3.5b - Screenshots | pending | |
      | 4 - Sync | pending | |
      | 4b - Visual QA | skipped | |
      | 5 - Render Prep | pending | |
      | 5 - Render | pending (manual) | |
      STATUS

      echo "ANIMATION_NAME=${animation_name}"
      echo "PARAMS_JSON=$ARTIFACTS_DIR/params.json"
      echo "STATUS_FILE=src/${animation_name}/phase-status.md"
    depends_on: [parse-params]
    timeout: 15000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 0 — Research
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase0-research
    prompt: |
      You are executing **DIY-YT Phase 0 — Research** in an isolated session.

      Before starting, read:
      - `$ARTIFACTS_DIR/params.json` — all workflow parameters
      - `$ARTIFACTS_DIR/animation_name.txt` — the AnimationName

      Then Read `.archon/commands/diy-phase0-research.md` and execute its
      instructions verbatim. Wherever the spec references `$ARGUMENTS`,
      substitute the **topic** field from params.json (falling back to
      animation_name if topic is empty). Run in **autonomous mode** — do not
      ask the user questions, do not pause for review.

      When done, update `src/<AnimationName>/phase-status.md` to mark
      "0 - Research" as `done` with today's date. Return a <200-word receipt
      listing only: files written, source counts, any warnings. Do NOT echo
      research bodies.
    depends_on: [init-context]
    context: fresh
    idle_timeout: 1800000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 1 — Plan
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase1-plan
    prompt: |
      You are executing **DIY-YT Phase 1 — Plan** in an isolated session.

      Read `$ARTIFACTS_DIR/params.json` and `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase1-plan.md` and follow its
      instructions verbatim, substituting `$ARGUMENTS` with the AnimationName.
      Run autonomously — no user questions.

      Expected output: `.agents/plans/<AnimationName>.plan.md`
      Update `phase-status.md` row "1 - Plan" → done + date.
      Return a <200-word summary (plan file path, scene count, total duration).
    depends_on: [phase0-research]
    context: fresh
    idle_timeout: 1200000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 2 — Script (raw)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase2-script
    prompt: |
      You are executing **DIY-YT Phase 2 — Script** in an isolated session.

      Read `$ARTIFACTS_DIR/params.json` + `animation_name.txt`.
      Then Read `.archon/commands/diy-phase2-script.md` and follow it.
      Substitute `$ARGUMENTS` with AnimationName. Autonomous mode: skip review
      checkpoint — proceed immediately to Phase 2.5.

      MANDATORY: include Scene 00 Preview hook (10-15s teaser).
      Expected output: `src/<AnimationName>/scripts/full-script.md`
      Update phase-status.md row "2 - Script" → done + date. <200-word summary.
    depends_on: [phase1-plan]
    context: fresh
    idle_timeout: 1800000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 2.5 — Critique (GATE)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase2-5-critique
    prompt: |
      You are executing **DIY-YT Phase 2.5 — Script Critique (GATE)** in an
      isolated session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase2-5-critique.md` and follow it.
      Substitute `$ARGUMENTS` with AnimationName.

      This is a **gate phase**. After running all 5 passes:
      - If ALL of (hook_score >= 7.0, story_arc_score >= 7.0,
        loop_opener_count >= required, banned_phrase_count == 0) → PASS.
      - Otherwise → FAIL.

      Update phase-status.md row "2.5 - Critique" accordingly.
      Expected output: `src/<AnimationName>/scripts/critique-report.md`

      Return structured output matching the output_format schema.
    depends_on: [phase2-script]
    context: fresh
    idle_timeout: 1200000
    output_format:
      type: object
      properties:
        gate_passed:         { type: boolean }
        hook_score:          { type: number }
        story_arc_score:     { type: number }
        loop_opener_count:   { type: number }
        banned_phrase_count: { type: number }
        failing_gates:
          type: array
          items: { type: string }
        report_path:         { type: string }
      required: [gate_passed, report_path]

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 2a — TTS Script (only if 2.5 passed)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase2a-script
    prompt: |
      You are executing **DIY-YT Phase 2a — TTS Script** in an isolated session.

      Read `$ARTIFACTS_DIR/animation_name.txt` + `params.json`.
      Then Read `.archon/commands/diy-phase2a-script.md` and follow it.
      Substitute `$ARGUMENTS` with AnimationName.

      MANDATORY: `src/<AnimationName>/scripts/scene-00-preview.txt` (25-37 words).
      Plus per-scene files `scene-NN-<name>.txt`.
      Update phase-status.md row "2a - TTS Script" → done + date.
    depends_on: [phase2-5-critique]
    when: "$phase2-5-critique.output.gate_passed == 'true'"
    context: fresh
    idle_timeout: 1200000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 2b — Fact Check (GATE)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase2b-factcheck
    prompt: |
      You are executing **DIY-YT Phase 2b — Fact Check (GATE)** in an isolated
      session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase2b-factcheck.md` and follow it.
      Substitute `$ARGUMENTS` with AnimationName.

      Gate rule: ALL Tier-1 claims must be VERIFIED (or auto-corrected as minor).
      Any UNVERIFIED or failed Tier-1 claim → FAIL.

      Update phase-status.md row "2b - Fact Check" accordingly.
      Expected output: `src/<AnimationName>/scripts/fact-check-report.md`
      Optional (if PERPLEXITY_API_KEY set):
        `src/<AnimationName>/scripts/perplexity-results.json`

      Return structured output matching the schema.
    depends_on: [phase2a-script]
    context: fresh
    idle_timeout: 1800000
    output_format:
      type: object
      properties:
        gate_passed:       { type: boolean }
        tier1_verified:    { type: number }
        tier1_failed:      { type: number }
        corrections_applied: { type: number }
        report_path:       { type: string }
      required: [gate_passed, report_path]

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 3 — Audio (only if 2b passed)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase3-audio
    prompt: |
      You are executing **DIY-YT Phase 3 — Audio** in an isolated session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase3-audio.md` and follow it.
      Substitute `$ARGUMENTS` with AnimationName.

      Generation order:
      1. Preview audio FIRST:
         `python text-to-speech.py --name scene00 --preview ...`
      2. Then batch all scenes:
         `python generate-all-audio.py <AnimationName> --parallel 5`

      Summarize TTS logs — do NOT echo full Python output.

      Expected outputs:
      - `public/audio/<AnimationName>/scene00.mp3` + `sceneNN.mp3`
      - `src/<AnimationName>/scripts/sceneNN-sync.json`
      - `src/<AnimationName>/constants/timing.ts`

      Update phase-status.md row "3 - Audio" → done + date.
    depends_on: [phase2b-factcheck]
    when: "$phase2b-factcheck.output.gate_passed == 'true'"
    context: fresh
    idle_timeout: 2400000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 3.2 — BG Music (non-AI bash, auto, non-blocking)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase3-2-bgmusic
    bash: |
      set -eu
      animation_name=$(cat "$ARTIFACTS_DIR/animation_name.txt")
      plan_file=".agents/plans/${animation_name}.plan.md"

      # Extract music profile from plan (fallback to defaults if absent)
      hook_mood="dramatic-cinematic"
      hook_bpm="100-110"
      body_bpm="75-90"
      cta_bpm="110-120"
      if [ -f "$plan_file" ]; then
        hm=$(grep -E "^\s*hook_mood:" "$plan_file" | head -1 | sed -E 's/.*hook_mood:\s*"?([^"]*)"?/\1/' || true)
        hb=$(grep -E "^\s*hook_bpm:"  "$plan_file" | head -1 | sed -E 's/.*hook_bpm:\s*"?([^"]*)"?/\1/'  || true)
        bb=$(grep -E "^\s*body_bpm:"  "$plan_file" | head -1 | sed -E 's/.*body_bpm:\s*"?([^"]*)"?/\1/'  || true)
        cb=$(grep -E "^\s*cta_bpm:"   "$plan_file" | head -1 | sed -E 's/.*cta_bpm:\s*"?([^"]*)"?/\1/'   || true)
        [ -n "$hm" ] && hook_mood="$hm"
        [ -n "$hb" ] && hook_bpm="$hb"
        [ -n "$bb" ] && body_bpm="$bb"
        [ -n "$cb" ] && cta_bpm="$cb"
      fi

      if [ ! -f generate-bg-music.py ]; then
        echo "BG_MUSIC=skipped (generate-bg-music.py not found)"
        exit 0
      fi

      python generate-bg-music.py "$animation_name" --multi-segment \
        --hook-mood "$hook_mood" \
        --hook-bpm  "$hook_bpm" \
        --body-bpm  "$body_bpm" \
        --cta-bpm   "$cta_bpm" 2>&1 | tail -20 || {
          echo "BG_MUSIC=failed (non-blocking, continuing)"
          exit 0
        }
      echo "BG_MUSIC=done (hook_mood=$hook_mood, hook_bpm=$hook_bpm, body_bpm=$body_bpm, cta_bpm=$cta_bpm)"
    depends_on: [phase3-audio]
    timeout: 600000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 3.5 — Retention (runs in parallel with 3.5b)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase3-5-retention
    prompt: |
      You are executing **DIY-YT Phase 3.5 — Retention Strategy** in an isolated
      session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-retention-strategy.md` and follow its
      instructions verbatim. The AnimationName is the input.

      Read all required inputs from disk:
      - `.agents/plans/<AnimationName>.plan.md`
      - `src/<AnimationName>/scripts/full-script.md`
      - `src/<AnimationName>/scripts/sceneNN-sync.json`
      - `src/<AnimationName>/constants/timing.ts`

      Expected output:
      - `src/<AnimationName>/retention-strategy.md` (per-scene components)

      Update phase-status.md row "3.5 - Retention" → done + date.
    depends_on: [phase3-audio]
    context: fresh
    idle_timeout: 1200000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 3.5b — Screenshots (conditional bash, parallel with 3.5)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase3-5b-screenshots
    bash: |
      set -eu
      animation_name=$(cat "$ARTIFACTS_DIR/animation_name.txt")
      plan_file=".agents/plans/${animation_name}.plan.md"

      if [ ! -f "$plan_file" ]; then
        echo "SCREENSHOTS=skipped (no plan file)"
        exit 0
      fi

      if ! grep -qE "^\s*screenshots:" "$plan_file"; then
        echo "SCREENSHOTS=skipped (no screenshots: section in plan)"
        exit 0
      fi

      if [ ! -f capture-screenshots.py ]; then
        echo "SCREENSHOTS=skipped (capture-screenshots.py not found)"
        exit 0
      fi

      python capture-screenshots.py "$animation_name" 2>&1 | tail -30 || {
        echo "SCREENSHOTS=warning (some captures failed — Phase 4 uses placeholders)"
        exit 0
      }
      echo "SCREENSHOTS=done"
    depends_on: [phase3-audio]
    timeout: 600000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 4 — Sync (scene builder subagent)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase4-sync
    prompt: |
      You are executing **DIY-YT Phase 4 — Sync / Scene Builder** in an
      isolated session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase4-scene-builder.md` and follow its
      instructions verbatim. The AnimationName is the input.

      Read all required inputs from disk:
      - `.agents/plans/<AnimationName>.plan.md`
      - `src/<AnimationName>/scripts/sceneNN-sync.json`
      - `src/<AnimationName>/constants/timing.ts`
      - `src/<AnimationName>/scripts/full-script.md`
      - `src/<AnimationName>/retention-strategy.md`

      Expected outputs:
      - `src/<AnimationName>/constants/` (colors, fonts, springs, timing)
      - `src/<AnimationName>/components/`
      - `src/<AnimationName>/scenes/Scene00Preview.tsx` (MANDATORY)
      - `src/<AnimationName>/scenes/Scene01*.tsx` … `SceneNN*.tsx`
      - `src/<AnimationName>/Composition.tsx` (MUST include OutroSequence + BrandWatermark)
      - `src/Root.tsx` (updated)
      - `src/<AnimationName>/qa-frames.json` (MANDATORY)
      - `out/<AnimationName>/validate-*.md`

      Hard-fail if any scene reports ❌ FAIL, if qa-frames.json is missing,
      or if Composition.tsx omits OutroSequence / BrandWatermark.

      Update phase-status.md row "4 - Sync" accordingly.
      Return the scene inventory in <200 words.
    depends_on: [phase3-5-retention, phase3-5b-screenshots]
    trigger_rule: none_failed_min_one_success
    context: fresh
    idle_timeout: 3600000

  # ═════════════════════════════════════════════════════════════════════════
  # Phase 5 — Render Prep (HARD GATE — workflow stops here)
  # ═════════════════════════════════════════════════════════════════════════

  - id: phase5-render-prep
    prompt: |
      You are executing **DIY-YT Phase 5 — Render Prep (HARD GATE)** in an
      isolated session.

      Read `$ARTIFACTS_DIR/animation_name.txt`.
      Then Read `.archon/commands/diy-phase5-render.md` and follow STEPS 1-4
      ONLY (validation, lint, YouTube description generation, summary build).

      ⛔ DO NOT run `remotion render` or full-video `remotion still`. ⛔
      The actual render requires explicit user approval outside this workflow.

      Expected outputs:
      - `src/<AnimationName>/youtube-description.md`
      - Validation reports

      Update phase-status.md row "5 - Render Prep" → done + date.

      Return structured output with the full composition summary so the
      final node can surface it to the user.
    depends_on: [phase4-sync]
    context: fresh
    idle_timeout: 1200000
    output_format:
      type: object
      properties:
        animation_name:    { type: string }
        scene_count:       { type: number }
        duration_seconds:  { type: number }
        frames_30fps:      { type: number }
        resolution:        { type: string }
        lint_clean:        { type: boolean }
        typecheck_clean:   { type: boolean }
        warnings:
          type: array
          items: { type: string }
        description_path:  { type: string }
      required: [animation_name, scene_count, duration_seconds]

  # ═════════════════════════════════════════════════════════════════════════
  # Final — Summary + render-command hint
  # ═════════════════════════════════════════════════════════════════════════

  - id: summarize
    prompt: |
      Produce the final workflow report. Keep under 250 words. Plain text,
      no code fences except for the render command.

      # DIY-YT Video Creation — Pre-Render Complete

      **Composition**:    $phase5-render-prep.output.animation_name
      **Duration**:       $phase5-render-prep.output.duration_seconds s
                          ($phase5-render-prep.output.frames_30fps frames @ 30fps)
      **Resolution**:     $phase5-render-prep.output.resolution
      **Scenes**:         $phase5-render-prep.output.scene_count
      **Lint**:           $phase5-render-prep.output.lint_clean
      **Type-check**:     $phase5-render-prep.output.typecheck_clean

      **Gate results**:
      - Phase 2.5 (critique): $phase2-5-critique.output
      - Phase 2b (factcheck): $phase2b-factcheck.output

      **Warnings**:
      $phase5-render-prep.output.warnings

      ## Next step — MANUAL render

      The workflow has stopped at the hard render gate. Review the
      composition in Remotion Studio, then run:

      ```bash
      pnpm run dev   # preview at http://localhost:3000
      # once satisfied:
      pnpm exec remotion render <AnimationName> out/<AnimationName>/final.mp4 --codec h264 --crf 18
      ```

      Then, optionally:
      - `/diy-phase6-upload <AnimationName>` — YouTube description + upload
    depends_on: [phase5-render-prep]
    model: haiku
    allowed_tools: []
